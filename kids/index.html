<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Мир Августины</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Мир Августины">
<meta name="theme-color" content="#b89cf5">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Comfortaa:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf7ff; --card:#ffffff; --ink:#3b2a63; --soft:#8d7bb5; --lav:#b89cf5; --lav2:#e9e0ff;
  --deep:#6a48c9; --gold:#f2b93b; --gold2:#ffe7a6; --pink:#ff8fc0; --mint:#5fd3ad; --red:#ff6b81;
  --r:22px; --shadow:0 8px 24px rgba(106,72,201,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;user-select:text;-webkit-user-select:text}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px 6px}
.who{flex:1;min-width:0}
.who .t{font-family:Comfortaa;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .lv{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--soft)}
.bar{height:8px;border-radius:9px;background:var(--lav2);overflow:hidden;flex:1;max-width:160px}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--lav),var(--deep));transition:width .6s}
.coin{display:flex;align-items:center;gap:4px;background:#fff;border-radius:99px;padding:6px 12px;font-weight:900;box-shadow:var(--shadow);font-size:16px}
.coin.st{background:var(--gold2)}
.lock{width:38px;height:38px;border-radius:50%;background:#fff;box-shadow:var(--shadow);font-size:17px}
main{flex:1;overflow:hidden;position:relative}
.page{position:absolute;inset:0;overflow-y:auto;padding:6px 14px 110px;display:none;-webkit-overflow-scrolling:touch}
.page.on{display:block;animation:pageIn .35s ease}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{font-family:Comfortaa;font-size:20px;margin:14px 2px 10px}
h3{margin:0 0 8px;font-size:17px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.muted{color:var(--soft);font-weight:700;font-size:14px}
nav{position:absolute;left:12px;right:12px;bottom:12px;display:flex;justify-content:space-around;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:26px;box-shadow:0 10px 30px rgba(106,72,201,.2);padding:6px;z-index:20}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px;border-radius:20px;font-size:11px;font-weight:800;color:var(--soft);transition:.2s;position:relative}
nav button b{font-size:23px;line-height:1;transition:transform .25s}
nav button.on{background:var(--lav2);color:var(--deep)}
nav button.on b{transform:scale(1.15) translateY(-1px)}
nav button .dot{position:absolute;top:4px;right:22%;width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px #fff}
/* ===== сцена ===== */
.scene{position:relative;height:min(58vh,560px);min-height:330px;border-radius:30px;overflow:hidden;box-shadow:var(--shadow);background:#e9dcc8}
.scene .bg{position:absolute;inset:0}
.scene .bg svg,.scene .bg img{width:100%;height:100%;display:block;transition:filter .8s}
.scene.night .bg img,.scene.night .bg svg{filter:brightness(.55) saturate(.85) hue-rotate(-12deg)}
.scene .nightsky{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .8s;background:radial-gradient(circle at 70% 18%,#fff8 0,transparent 4%),linear-gradient(180deg,#1b164a55,transparent 60%)}
.scene.night .nightsky{opacity:1}
.sparkle{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;opacity:0;animation:twinkle 4s infinite;pointer-events:none}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:.9;transform:scale(1.2)}}
.dust{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff7d6;opacity:.0;animation:dust 9s linear infinite;pointer-events:none}
@keyframes dust{0%{opacity:0;transform:translate(0,0)}20%{opacity:.8}100%{opacity:0;transform:translate(40px,-80px)}}
.actor{position:absolute;bottom:7%;transform-origin:50% 100%;z-index:2}
.actor .stack{position:relative;height:100%;transform-origin:50% 100%}
.actor img{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:100%;transition:opacity .45s ease;pointer-events:none;filter:drop-shadow(0 6px 8px rgba(60,30,100,.22))}
.actor .shadow{position:absolute;bottom:-3%;left:50%;width:60%;height:5%;transform:translateX(-50%);border-radius:50%;background:rgba(60,30,100,.22);filter:blur(3px);animation:shadowB 3.6s ease-in-out infinite}
#girl{left:10%;height:82%;width:40%}
#pet{right:6%;height:40%;width:36%}
.breathe{animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.022)}}
.bob{animation:bob 2.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-6%) rotate(1.5deg)}}
@keyframes shadowB{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(.9)}}
.hop{animation:hop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{0%{transform:scale(1,1)}20%{transform:scale(1.1,.88)}50%{transform:translateY(-14%) scale(.95,1.07)}80%{transform:scale(1.04,.96)}100%{transform:none}}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}20%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}
.dim img{filter:grayscale(.5) brightness(.95) drop-shadow(0 6px 8px rgba(60,30,100,.2))}
.bubble{position:absolute;right:5%;bottom:51%;max-width:46%;background:#fff;border-radius:18px;padding:9px 13px;font-weight:800;font-size:14px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px) scale(.9);transition:.35s;pointer-events:none;z-index:4}
.bubble.on{opacity:1;transform:none}
.bubble:after{content:"";position:absolute;bottom:-8px;right:34%;border:9px solid transparent;border-top-color:#fff;border-bottom:0}
.badge{position:absolute;top:-6%;right:2%;font-size:28px;animation:bob 2s ease-in-out infinite}
.zz{position:absolute;top:0;right:10%;font-weight:900;color:#fff;font-size:20px;animation:zz 2.4s infinite;text-shadow:0 2px 6px #6a48c9}
@keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(18px,-40px) scale(1.3)}}
.stitle{position:absolute;left:12px;top:12px;background:#ffffffdd;border-radius:99px;padding:5px 12px;font-weight:900;font-size:13px;color:var(--deep);z-index:4}
.mess{position:absolute;font-size:clamp(46px,8vw,78px);line-height:1;z-index:1;transform:rotate(var(--r,0deg));filter:drop-shadow(0 3px 2px #0003);transition:transform .5s,opacity .5s}
.mess.gone{transform:scale(0) rotate(90deg)!important;opacity:0}
.mess.stain{width:clamp(70px,13vw,130px);height:clamp(26px,4.5vw,46px);border-radius:50%;background:radial-gradient(ellipse at 40% 40%,#8a6a4a 0,#6e5034 55%,transparent 72%);opacity:.75;filter:blur(1px)}
.mess.drop{animation:dropIn .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes dropIn{0%{transform:translateY(-200px) rotate(var(--r,0deg));opacity:0}100%{transform:rotate(var(--r,0deg));opacity:1}}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.slot{border:3px dashed var(--lav);border-radius:18px;aspect-ratio:1.2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:900;background:#faf7ff;overflow:hidden;position:relative}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot.ok{border-style:solid;border-color:var(--mint)}
.slot .e{font-size:34px}
.slot .ck{position:absolute;top:6px;right:6px;background:var(--mint);color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;z-index:1}
.rooms{position:absolute;right:10px;top:10px;display:flex;gap:6px;z-index:4}
.rooms button{width:36px;height:36px;border-radius:50%;background:#ffffffcc;font-size:18px;box-shadow:0 2px 8px #0002}
.rooms button.on{background:#fff;box-shadow:0 0 0 3px var(--lav)}
/* сейчас */
.now{display:flex;align-items:center;gap:12px;border:2px solid var(--lav);background:linear-gradient(135deg,#fff,#f6f0ff)}
.now .e{font-size:38px}
.now .tx{flex:1;min-width:0}
.now .tx b{display:block;font-size:17px}
.now.late{border-color:var(--red);background:linear-gradient(135deg,#fff,#fff0f3);animation:pulse 1.4s infinite}
.stats{display:flex;gap:10px;margin:12px 0}
.stat{flex:1;background:#fff;border-radius:18px;padding:10px 12px;box-shadow:var(--shadow)}
.stat .l{display:flex;justify-content:space-between;font-weight:800;font-size:13px;margin-bottom:6px}
.stat .bar{max-width:none;height:10px}
.stat.food .bar i{background:linear-gradient(90deg,#ffc36b,#ff8f5a)}
.stat.joy .bar i{background:linear-gradient(90deg,#ff9ed0,#c27bff)}
.stat.clean .bar i{background:linear-gradient(90deg,#8ee6c8,#3fbf95)}
.stat.low{animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px #ff6b8155}}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.act{background:#fff;border-radius:20px;padding:12px 6px;box-shadow:var(--shadow);font-weight:800;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .15s}
.act b{font-size:28px}
.act:active,.btn:active,.chip:active,.item:active,.row button:active{transform:scale(.95)}
.today{display:flex;align-items:center;gap:14px}
.ring{width:64px;height:64px;flex:none}
/* расписание */
.part{font-family:Comfortaa;font-size:18px;margin:18px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.part small{font-family:Nunito;font-weight:800;font-size:13px;color:var(--soft)}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:18px;background:#fff;box-shadow:var(--shadow);margin-bottom:8px;position:relative}
.row .tm{width:46px;font-weight:900;font-size:14px;color:var(--soft);font-variant-numeric:tabular-nums}
.row .e{font-size:26px;width:32px;text-align:center}
.row .tx{flex:1;font-weight:800;font-size:15px;min-width:0}
.row .tx small{display:block;font-weight:700;font-size:12px;color:var(--soft)}
.row.cur{box-shadow:0 0 0 3px var(--lav),var(--shadow)}
.row.late{box-shadow:0 0 0 3px var(--red),var(--shadow)}
.row.ok{background:#e9fbf4}
.row.lateok{background:#fff7e3}
.row.miss{background:#fff0f3;opacity:.8}
.row.wait{opacity:.55}
.subs{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 10px 56px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:7px;padding:9px 12px;border-radius:14px;background:var(--lav2);font-weight:800;font-size:13px;transition:.2s}
.chip.done{background:#d8f7ec;color:#1f8f69}
.chip.done:after{content:"✓";font-weight:900}
.lesson .head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.lesson .name{font-weight:900;font-size:16px}
.tag{font-size:12px;font-weight:900;padding:4px 10px;border-radius:99px;background:var(--lav2);color:var(--deep);white-space:nowrap}
.tag.ok{background:#d8f7ec;color:#1f8f69}.tag.wait{background:var(--gold2);color:#9a6a00}.tag.bad{background:#ffe0e6;color:#c2334d}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:16px;background:#f7f3ff;font-weight:700;font-size:14px}
.step .ic{font-size:22px;width:30px;text-align:center}
.step .tx{flex:1}
.step small{display:block;color:var(--soft);font-weight:700;font-size:12px}
.step.done{background:#e6faf2;color:#1f8f69}
.step.locked{opacity:.45}
.step.cur{background:#fff;box-shadow:0 0 0 2px var(--lav) inset}
.btn{background:linear-gradient(135deg,var(--lav),var(--deep));color:#fff;font-weight:900;padding:10px 16px;border-radius:14px;box-shadow:0 6px 14px rgba(106,72,201,.3);transition:transform .15s;white-space:nowrap}
.btn.gold{background:linear-gradient(135deg,#ffd66b,#f2a93b);color:#5a3a00;box-shadow:0 6px 14px rgba(242,169,59,.35)}
.btn.mint{background:linear-gradient(135deg,#7fe6c4,#2fb488);box-shadow:0 6px 14px rgba(47,180,136,.35)}
.btn.ghost{background:#fff;color:var(--deep);box-shadow:inset 0 0 0 2px var(--lav)}
.btn.small{padding:7px 11px;font-size:13px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;box-shadow:0 2px 6px #0002}
.testin{width:70px;padding:8px;border-radius:12px;border:2px solid var(--lav);text-align:center;font-weight:900;font-size:16px}
.tabs{display:flex;gap:8px;margin:6px 0 12px;flex-wrap:wrap}
.tabs button{padding:9px 16px;border-radius:99px;background:#fff;font-weight:900;box-shadow:var(--shadow)}
.tabs button.on{background:var(--deep);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{background:#fff;border-radius:20px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;position:relative;transition:transform .15s}
.item .pic{height:130px;display:flex;align-items:flex-end;justify-content:center;font-size:60px;width:100%}
.item .pic img{max-height:130px;max-width:100%}
.item .pic svg,.item .pic img.rimg{width:100%;height:120px;border-radius:14px;object-fit:cover}
.item .nm{font-weight:900;font-size:14px;line-height:1.15}
.item .ds{font-size:12px;color:var(--soft);font-weight:700;min-height:16px}
.item.lockd .pic img{filter:brightness(0) opacity(.22)}
.item.lockd .pic img.rimg,.item.lockd .pic svg{filter:grayscale(1) opacity(.4)}
.item .rib{position:absolute;top:10px;left:10px;font-size:11px;font-weight:900;padding:3px 8px;border-radius:99px;background:var(--gold2);color:#9a6a00;z-index:1}
.item.wearing{box-shadow:0 0 0 3px var(--mint),var(--shadow)}
.rew{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:#fff;box-shadow:var(--shadow);margin-bottom:10px}
.rew .e{font-size:34px;width:48px;text-align:center}
.rew .tx{flex:1;font-weight:900}
.rew small{display:block;font-weight:700;color:var(--soft)}
.focus{display:flex;flex-direction:column;align-items:center;text-align:center}
.timer{position:relative;width:min(70vw,300px);aspect-ratio:1;margin:8px auto}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer .in img{height:50%}
.timer .tm{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;margin-top:-4px}
.seg{display:flex;background:#fff;border-radius:99px;padding:4px;box-shadow:var(--shadow);margin:8px 0}
.seg button{padding:8px 16px;border-radius:99px;font-weight:900}
.seg button.on{background:var(--lav2);color:var(--deep)}
.mini-tip{font-size:13px;color:var(--soft);font-weight:700;max-width:420px}
.ov{position:fixed;inset:0;background:rgba(48,28,96,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov.on{display:flex;animation:pageIn .25s}
.modal{background:#fff;border-radius:28px;padding:22px;width:min(540px,100%);max-height:92vh;overflow-y:auto;text-align:center;box-shadow:0 20px 60px #0004}
.modal h2{margin-top:0}
.eggs{display:flex;justify-content:center;gap:10px;margin:14px 0}
.eggs button{flex:1;max-width:140px;padding:8px;border-radius:20px;transition:.2s}
.eggs button img{width:100%}
.eggs button.sel{background:var(--lav2);transform:translateY(-6px)}
.eggs button.sel img{animation:wobble 1s infinite}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.hatch{position:relative;height:280px;display:flex;align-items:flex-end;justify-content:center}
.hatch img{height:240px;position:absolute;bottom:10px}
.egg-crazy{animation:crazy .18s infinite}
@keyframes crazy{0%{transform:rotate(-9deg) translateX(-4px)}50%{transform:rotate(9deg) translateX(4px)}100%{transform:rotate(-9deg)}}
.pop{animation:popIn .9s cubic-bezier(.2,1.6,.4,1)}
@keyframes popIn{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
.flash{position:fixed;inset:0;background:radial-gradient(circle,#fff 0,#fff8 40%,transparent 70%);opacity:0;pointer-events:none;z-index:80}
.flash.go{animation:flash 1s ease-out}
@keyframes flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.rays{position:absolute;left:50%;bottom:20%;width:150%;aspect-ratio:1;transform:translate(-50%,50%);background:repeating-conic-gradient(#ffe7a655 0 10deg,transparent 10deg 20deg);border-radius:50%;animation:spin 8s linear infinite;pointer-events:none;z-index:1}
@keyframes spin{to{transform:translate(-50%,50%) rotate(360deg)}}
.namein{width:100%;padding:12px;border-radius:16px;border:2px solid var(--lav);font-size:20px;font-weight:900;text-align:center;margin:10px 0}
textarea.diary{width:100%;min-height:70px;padding:12px;border-radius:16px;border:2px solid var(--lav2);font-size:16px;font-weight:700;margin:4px 0 10px;resize:vertical;background:#fdfbff}
textarea.diary:focus,.namein:focus{outline:none;border-color:var(--lav)}
.pin{display:grid;grid-template-columns:repeat(3,70px);gap:10px;justify-content:center;margin:14px 0}
.pin button{height:62px;border-radius:18px;background:var(--lav2);font-size:24px;font-weight:900}
.dots{display:flex;gap:10px;justify-content:center;font-size:22px;letter-spacing:4px}
.pt{position:fixed;pointer-events:none;z-index:90;font-size:24px;will-change:transform,opacity}
.gain{position:fixed;pointer-events:none;z-index:91;font-weight:900;font-size:20px;color:var(--deep);text-shadow:0 2px 0 #fff,0 0 8px #fff;animation:gain 1.3s ease-out forwards;white-space:nowrap}
@keyframes gain{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1;transform:translateY(-10px) scale(1.15)}100%{opacity:0;transform:translateY(-70px) scale(1)}}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-160%);background:#fff;padding:12px 18px;border-radius:18px;box-shadow:0 10px 30px #6a48c944;font-weight:900;z-index:95;transition:transform .4s cubic-bezier(.3,1.5,.5,1);max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0)}
.forest{position:relative;border-radius:30px;overflow:hidden;box-shadow:var(--shadow)}
.forest img{width:100%;display:block}
.forest .msg{position:absolute;left:12px;right:12px;bottom:12px;background:#ffffffe6;border-radius:20px;padding:14px;text-align:center;font-weight:800}
.prow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0eafc;text-align:left;flex-wrap:wrap}
.prow:last-child{border-bottom:0}
.prow .tx{flex:1;font-weight:800;min-width:140px}
.prow small{display:block;color:var(--soft);font-weight:700}
.prow input[type=time]{border:2px solid var(--lav2);border-radius:10px;padding:5px;font-weight:800}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}
.kpi{background:#f7f3ff;border-radius:16px;padding:10px;text-align:center}
.kpi b{display:block;font-size:22px;color:var(--deep)}
.kpi span{font-size:12px;font-weight:800;color:var(--soft)}
.left{text-align:left}
.photo-big{max-width:100%;border-radius:14px;margin:6px 0}
.rule{display:flex;gap:10px;align-items:flex-start;font-weight:700;font-size:14px;margin:6px 0}
.rule b{font-size:20px}
@media (min-width:900px){
  #home .wrap{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
  .scene{height:min(72vh,660px)}
  .page{padding-left:24px;padding-right:24px}
  nav{left:50%;right:auto;transform:translateX(-50%);width:560px}
}
@media (max-width:420px){
  nav button span{display:none}
  .top .who .t{font-size:15px}

const isWeekend=d=>{const w=(d||new Date()).getDay();return w===0||w===6};
function schedFor(dateStr){const d=new Date(dateStr+'T12:00:00'),wd=d.getDay();let L=isWeekend(d)?S.schedWE:S.schedWD;
  if(wd===0&&!L.find(x=>x.id==='bagpack'))L=[...L,S.schedWD.find(x=>x.id==='bagpack')].sort((a,b)=>tmin(a.at)-tmin(b.at));
  // отбой: пятница и суббота — до 22:00, воскресенье — в 21:00
  if(wd===5)L=L.map(x=>x.id==='sleep'?{...x,at:'21:30',by:'22:00'}:x);
  if(wd===0)L=L.map(x=>x.id==='sleep'?{...x,at:'21:00',by:'21:10'}:x);
  return L}
/* ---- уроки ---- */
const LK=(s,n)=>s+':'+n, LP=k=>{const[s,n]=k.split(':');return{s,n:+n}};
const OPEN=['prog','fix','returned'];
const ltitle=(s,n)=>SUBJ[s].L[n-1]||('Урок '+n);
const lget=k=>{const{s,n}=LP(k);return S.prog[s][n]};
function lstart(k){const{s,n}=LP(k);if(!S.prog[s][n])S.prog[s][n]={st:'prog',step:0,photos:{}};return S.prog[s][n]}
const isOpenK=k=>{const x=lget(k);return !x||OPEN.includes(x.st)};
const isDoneSt=x=>x&&(x.st==='done'||x.st==='review');
function nextLesson(excl){
  for(const s of ROT)for(const n of Object.keys(S.prog[s]).map(Number).sort((a,b)=>a-b)){if(OPEN.includes(S.prog[s][n].st)&&!excl.includes(LK(s,n)))return LK(s,n)}
  for(let i=0;i<ROT.length;i++){const s=ROT[(S.rot+i)%ROT.length];for(let n=1;n<=SUBJ[s].L.length;n++){if(!S.prog[s][n]&&!excl.includes(LK(s,n))){S.rot=(S.rot+i+1)%ROT.length;return LK(s,n)}}}
  return null}
const PER_DAY=2;
function newDay(carry=[]){const wd=new Date().getDay(),list=[...carry];
  if(wd>=1&&wd<=5){while(list.length<PER_DAY){const k=nextLesson(list);if(!k)break;list.push(k)}}
  return{date:today(),r:{},sub:{},lessons:list,carry:[...carry],did:[],done:0,focus:0,tests:[]}}
function rollDay(){
  if(!S.day){S.day=newDay();return}
  if(!S.day.lessons){const d=S.day.date;S.day=Object.assign(S.day,newDay(),{date:d,r:S.day.r||{},sub:S.day.sub||{},done:S.day.done||0})}
  if(S.day.date===today())return;
  const prev=S.day,sch=schedFor(prev.date);
  const miss=sch.filter(it=>!prev.r[it.id]).length,ontime=sch.filter(it=>prev.r[it.id]&&!prev.r[it.id].late).length;
  S.history.push({date:prev.date,done:prev.done,sched:sch.length,ontime,miss,lessons:(prev.did||[]).length,total:prev.lessons.length,focus:prev.focus,tests:prev.tests});
  if(S.history.length>60)S.history.shift();
  if(!prev.r.laundry)addMess(['sock','shirt','pants']);
  if(!prev.r.tidy){addMess(['toy','book','paper','crayon','peel','cup','candy','stain']);if(!prev.tidyPen){S.crystals=Math.max(0,S.crystals-5);S.newMess=2}}
  S.joy=Math.max(0,S.joy-miss*3);
  const gap=Math.max(1,Math.round((new Date(today())-new Date(prev.date))/864e5));
  if(prev.done===0)S.missed+=gap;else S.missed=gap-1;
  if(S.missed>=2)S.sick=true;
  if(S.missed>=3)S.rescue=0;
  S.day=newDay(prev.lessons.filter(isOpenK));
}
function addMess(pool){for(let i=0;i<2;i++){if(S.mess.length>=MESS_MAX)return;const c=pool.filter(p=>!S.mess.includes(p));if(!c.length)return;S.mess.push(c[Math.floor(Math.random()*c.length)])}}
function tick(){const now=Date.now(),h=(now-S.lastTick)/36e5;if(h>0){S.food=Math.max(0,S.food-h*3);S.joy=Math.max(0,S.joy-h*1.2);S.lastTick=now}}

function burst(x,y,emojis,n=12,spread=120){for(let i=0;i<n;i++){const p=document.createElement('div');p.className='pt';p.textContent=emojis[i%emojis.length];p.style.left=x+'px';p.style.top=y+'px';document.body.appendChild(p);

let AC;function chime(notes=[660,880,1320]){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();notes.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;const t=AC.currentTime+i*.09;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.4)})}catch(e){}}
function replay(el,cls){if(!el)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}

function earn({cr=0,st=0,xp=0,pxp=0,joy=4,count=true},el){
  const lv0=level();S.crystals+=cr;S.stars+=st;S.xp+=xp;S.joy=Math.min(100,S.joy+joy);
  if(count){S.day.done++;if(petGone()){S.rescue++;if(S.rescue>=3){S.missed=0;S.sick=false;S.food=Math.max(S.food,50);S.joy=80;save();setTimeout(()=>{go('home');petReturns()},700)}}else if(S.missed>0)S.missed=0}
  if(pxp)addPetXP(pxp);
  if(el){const[x,y]=centerOf(el);let k=0;if(cr)floatUp(x,y,'+'+cr+' 💎',-(k++)*26);if(st)floatUp(x,y,'+'+st+' ⭐',-(k++)*26);if(!cr&&!st&&xp)floatUp(x,y,'+'+xp+' опыта');burst(x,y,cr?['✨','💎']:st?['✨','⭐']:['✨','💜'],8,90)}
  chime();if(level()>lv0)setTimeout(()=>{toast(`🎉 Новый уровень ${level()}!`);chime([523,659,784,1047])},600);

function itemState(it){
  const r=S.day.r[it.id],n=nowMin(),at=tmin(it.at),by=tmin(it.by);
  if(r)return r.late?'lateok':'ok';
  if(n<at-30)return'wait';
  if(n<=by)return n>=at?'cur':'soon';
  if(n<=by+120)return'late';
  return'miss';
}
function currentItem(){
  const L=schedFor(S.day.date);let lateOne=null,cur=null,next=null;
  for(const it of L){const s=itemState(it);if(s==='late'&&!lateOne)lateOne=it;if(s==='cur'&&!cur)cur=it;if((s==='soon'||s==='wait')&&!next)next=it}
  return{lateOne,cur,next};
}
function leftTxt(it){const d=Math.round(tmin(it.by)-nowMin());if(d>0)return`осталось ${d} мин`;return`опоздание ${-d} мин`}
function completeItem(id,el){
  const it=schedFor(S.day.date).find(x=>x.id===id);if(!it||S.day.r[id])return;
  if(it.sub){const sb=S.day.sub[id]||{};if(it.sub.some((s,i)=>!sb[i])){toast('Сначала отметь всё в списке 🎒');replay(el,'shake');return}}
  if(it.diary){openDiary(el);return}
  if(it.id==='tidy'){openRoomCheck();return}
  if(it.id==='neuro'){htab='neuro';go('hobby');if(!S.neuroRun)setTimeout(()=>toast('Нажми «Начать тренировку» 🎾'),300);return}
  const late=nowMin()>tmin(it.by);
  S.day.r[id]={at:Date.now(),late};
  const cr=late?Math.max(1,Math.floor(it.cr/2)):it.cr;
  earn({cr,xp:late?4:8,pxp:late?5:10,joy:late?1:4},el);
  if(late)toast(`Сделано, но с опозданием ⏰ +${cr} 💎`);else toast(`⚡ Вовремя! +${cr} 💎`);
  if(it.clean)doClean(it.clean);
  checkAllDay(el);rerender();
}
function checkAllDay(el){const L=schedFor(S.day.date);if(L.every(it=>S.day.r[it.id])&&!S.day.allBonus){S.day.allBonus=1;setTimeout(()=>{earn({cr:10,xp:20,pxp:25,count:false},el);toast('🌟 Весь режим дня выполнен! +10 💎');burst(innerWidth/2,innerHeight/3,['🌟','💎','🎉','✨'],26,220)},900)}}
function toggleSub(id,i,el){const sb=S.day.sub[id]=S.day.sub[id]||{};sb[i]=!sb[i];save();el.classList.toggle('done',!!sb[i]);if(sb[i]){chime([880]);const[x,y]=centerOf(el);burst(x,y,['✨'],4,40)}}

  const {lateOne,cur,next}=currentItem(),show=lateOne||cur;

  const dust=S.room==='attic'?Array.from({length:6},(_,i)=>`<i class="dust" style="left:${35+Math.random()*30}%;top:${20+Math.random()*30}%;animation-delay:${i*1.5}s"></i>`).join(''):'';
  const mess=S.mess.map((k,i)=>`<span class="mess ${k==='stain'?'stain':''} ${i>=S.mess.length-(S.newMess||0)?'drop':''}" data-k="${k}" style="left:${MESS_POS[i][0]}%;bottom:${MESS_POS[i][1]}%;--r:${MESS_POS[i][2]}deg;animation-delay:${(i%4)*.15}s">${MESS_ITEMS[k][0]}</span>`).join('');S.newMess=0;

     ${S.rooms.length>1?`<div class="rooms">${S.rooms.map(r=>`<button class="${r===S.room?'on':''}" onclick="setRoom('${r}')">${ROOMS.find(x=>x.id===r).e}</button>`).join('')}</div>`:''}
     <div class="actor" id="girl"><div class="shadow"></div><div class="stack breathe"><img><img></div></div>
     <div class="actor" id="pet"><div class="shadow"></div><div class="stack bob"><img><img></div><div class="badge" id="pbadge"></div></div>
     <div class="bubble" id="bubble"></div>
   </div></div><div>
   ${show?`<div class="card now ${lateOne?'late':''}" style="margin-top:12px"><span class="e">${show.e}</span><div class="tx"><span class="muted">${lateOne?'⏰ Опаздываешь!':'Сейчас по режиму'}</span><b>${show.nm}</b><span class="muted">до ${show.by} · ${leftTxt(show)}</span></div><button class="btn ${lateOne?'gold':''}" onclick="${show.sub?`go('day')`:`completeItem('${show.id}',this)`}">${show.sub?'Открыть':show.id==='tidy'?'Проверка 📷':show.id==='neuro'?'Тренировка ▶':show.diary?'Написать':'Сделала ✓'}</button></div>`
     :next?`<div class="card now" style="margin-top:12px;border-color:var(--lav2)"><span class="e">${next.e}</span><div class="tx"><span class="muted">Дальше в ${next.at}</span><b>${next.nm}</b></div></div>`:''}
   <div class="stats">
     <div class="stat food ${S.food<30?'low':''}"><div class="l"><span>🍪 Сытость</span><span>${Math.round(S.food)}%</span></div><div class="bar"><i style="width:${S.food}%"></i></div></div>
     <div class="stat joy ${S.joy<30?'low':''}"><div class="l"><span>💜 Радость</span><span>${Math.round(S.joy)}%</span></div><div class="bar"><i style="width:${S.joy}%"></i></div></div>

   </div></div>`;
  setImg($('#girl .stack'),girlImg());setPetVisual(m);
  $('#girl').onclick=girlTap;$('#pet').onclick=()=>petTap();$('#petBtn').onclick=()=>petTap();
  document.querySelectorAll('.mess').forEach(x=>x.onclick=()=>{replay(x,'shake');say('Это уберём вечером на «Убрать комнату» 🧹')});

function setRoom(r){S.room=r;save();renderHome();flash()}
function setPetVisual(m){const st=$('#pet .stack');if(!st)return;setImg(st,petImg(m));const pb=$('#pbadge');pb.innerHTML=m==='sleep'?'<span class="zz">z</span><span class="zz" style="animation-delay:.8s">Z</span>':petBadge(m);
  $('#pet').classList.toggle('dim',m==='sick'||m==='sad');$('#pet').style.height=([32,34,40,46,52,52][S.petStage]||40)+'%';st.className='stack '+(m==='sleep'?'breathe':'bob')}
function say(t){const b=$('#bubble');if(!b)return;b.textContent=t;b.classList.add('on');clearTimeout(bubbleT);bubbleT=setTimeout(()=>b.classList.remove('on'),3800)}
function sayRandom(m){const {lateOne,cur}=currentItem();let l;
  if(m==='happy'&&lateOne)l=[`Ты опаздываешь! ${lateOne.e} ${lateOne.nm} ⏰`];
  else if(m==='happy'&&cur)l=[`Сейчас: ${cur.nm} ${cur.e} — ${leftTxt(cur)}!`];
  else if(m==='happy'&&S.mess.length>=4&&Math.random()<.5)l=PHRASES.messy;
  else l=PHRASES[m]||PHRASES.happy;
  setTimeout(()=>say(l[Math.floor(Math.random()*l.length)]),700)}
function girlTap(){const g=$('#girl');replay(g,'hop');const[x,y]=centerOf(g);burst(x,y-60,['💖','✨','⭐'],8,90);chime([784,988]);
  if(S.girl>=4&&!S.outfit){const p=['gpose_jump','gpose_cheer','gpose_wave'];setImg($('#girl .stack'),p[Math.floor(Math.random()*3)]);setTimeout(()=>setImg($('#girl .stack'),girlImg()),1500)}}
function petTap(){const m=petMood(),p=$('#pet');if(!p)return;if(m==='sleep'){say('Тсс… я сплю 😴');return}
  replay(p.querySelector('.stack'),'hop');const[x,y]=centerOf(p);burst(x,y-30,['💜','💖','✨'],10,100);
  if(S.petsDay!==today()){S.petsDay=today();S.pets=0}if(S.pets<5){S.pets++;S.joy=Math.min(100,S.joy+3);save()}
  if(m==='happy'){setImg(p.querySelector('.stack'),petImg('jump'));setTimeout(()=>setPetVisual(petMood()),1400)}
  say(m==='hungry'?'Спасибо! А покушать? 🍪':m==='sick'?'Мне нужно лекарство 💊':'Р-р-р… это я так мурчу 💜');chime([880,1175]);setTimeout(renderHomeStats,300)}
function renderHomeStats(){[['food',S.food],['joy',S.joy],['clean',cleanPct()]].forEach(([k,v])=>{const f=document.querySelector('.stat.'+k);if(!f)return;f.querySelector('i').style.width=v+'%';f.querySelector('.l span:last-child').textContent=Math.round(v)+'%';f.classList.toggle('low',v<(k==='clean'?40:30))})}
function feedAnim(item){go('home');setTimeout(()=>{const p=$('#pet');if(!p)return;const[x,y]=centerOf(p);
  setImg(p.querySelector('.stack'),petImg(item.med?'happy':item.food?'eat':'jump'));if(petBadge('eat'))$('#pbadge').textContent=item.food?'😋':'💖';
  replay(p.querySelector('.stack'),'hop');setTimeout(()=>burst(x,y,item.med?['✨','💚','⭐']:['💖','✨',item.e],12,110),300);
  say(item.med?'Ура, я здоров! Спасибо! 💚':item.food?'Ням-ням! Как вкусно! 😋':'Ура, игрушка! 🎉');renderHomeStats();setTimeout(()=>setPetVisual(petMood()),2200)},350)}
function evolve(){go('home');setTimeout(()=>{const p=$('#pet');if(!p)return;const sc=$('#scene');const rays=document.createElement('div');rays.className='rays';sc.appendChild(rays);
  replay(p.querySelector('.stack'),'shake');setTimeout(()=>replay(p.querySelector('.stack'),'shake'),500);
  setTimeout(()=>{flash();chime([523,659,784,1047,1319]);setPetVisual(petMood());replay(p,'pop');const[x,y]=centerOf(p);burst(x,y,['⭐','✨','💜','🌟'],24,180);say(`Я вырос! Теперь я ${PET_STAGES[S.petStage].n.toLowerCase()}! 🎉`)},1100);
  setTimeout(()=>rays.remove(),4500)},400)}
function girlTransform(){go('home');setTimeout(()=>{const g=$('#girl');if(!g)return;const[x,y]=centerOf(g);burst(x,y,['✨','⭐','💫'],20,150);replay(g.querySelector('.stack'),'shake');
  setTimeout(()=>{flash();setImg(g.querySelector('.stack'),girlImg());replay(g,'pop');burst(x,y-40,['💖','✨','🌸'],16,140);chime([659,784,988,1319]);renderTop()},700)},350)}
function petReturns(){setTimeout(()=>{const p=$('#pet');if(!p)return;flash();replay(p,'pop');const[x,y]=centerOf(p);burst(x,y,['💜','🎉','✨'],22,160);say('Я вернулся! Я так скучал! 💜');toast(`🎉 ${S.petName} вернулся из леса!`);chime([523,659,784,1047])},500)}

/* =================== СТРАНИЦА: РЕЖИМ ДНЯ =================== */
function renderDay(){
  const el=$('#day'),L=schedFor(S.day.date);let h='';
  if(petGone())h+=`<div class="card" style="background:#e6faf2;margin-top:8px"><h3>🗺️ Спасательный квест</h3><div style="font-weight:700">Сделай 3 любых дела, чтобы ${S.petName} вернулся: ${S.rescue}/3</div></div>`;
  const ok=L.filter(it=>S.day.r[it.id]&&!S.day.r[it.id].late).length,lt=L.filter(it=>S.day.r[it.id]&&S.day.r[it.id].late).length;
  h+=`<div class="card" style="margin-top:8px;display:flex;gap:10px;align-items:center"><div style="flex:1"><h3 style="margin:0">🗓️ ${isWeekend()?'Выходной':'Учебный день'}</h3><div class="muted">⚡ вовремя ${ok} · ⏰ с опозданием ${lt} · всего ${L.length}</div></div><div class="muted" style="text-align:right">Вовремя — 💎 полностью<br>Опоздала — половина</div></div>`;
  ['m','d','e'].forEach(p=>{const items=L.filter(it=>it.part===p);if(!items.length)return;
    h+=`<div class="part">${PARTS[p][0]}<small>${items[0].at}–${items[items.length-1].by}</small></div>`;
    items.forEach(it=>{const s=itemState(it),r=S.day.r[it.id];
      let right;
      if(r&&r.fail)right=`<span class="tag bad">Не убралась −5💎</span>`;
      else if(s==='ok')right=`<span class="tag ok">⚡ Вовремя</span>`;
      else if(s==='lateok')right=`<span class="tag wait">⏰ Позже</span>`;
      else if(s==='miss')right=`<span class="tag bad">Пропущено</span>`;
      else if(s==='wait')right=`<span class="tag">в ${it.at}</span>`;
      else right=`<button class="btn small ${s==='late'?'gold':''}" onclick="completeItem('${it.id}',this)">${it.diary?'Написать':it.id==='tidy'?'Проверка 📷':it.id==='neuro'?'Тренировка ▶':'Сделала ✓'}</button>`;
      const sub=s==='cur'||s==='late'||s==='soon'?(s==='late'?`<small style="color:var(--red)">${leftTxt(it)}</small>`:s==='cur'?`<small>до ${it.by} · ${leftTxt(it)}</small>`:`<small>с ${it.at} до ${it.by}</small>`):r?`<small>в ${new Date(r.at).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}</small>`:'';
      h+=`<div class="row ${s}" data-id="${it.id}"><span class="tm">${it.at}</span><span class="e">${it.e}</span><span class="tx">${it.nm}${sub}</span>${right}</div>`;
      if(it.sub&&!r&&(s==='cur'||s==='late'||s==='soon')){const sb=S.day.sub[it.id]||{};h+=`<div class="subs">${it.sub.map((x,i)=>`<button class="chip ${sb[i]?'done':''}" onclick="toggleSub('${it.id}',${i},this)">${x}</button>`).join('')}</div>`}
    });
    if(p==='d'&&S.day.lessons.length)h+=`<div class="row" onclick="go('study')" style="cursor:pointer"><span class="tm">15:00</span><span class="e">📚</span><span class="tx">Уроки русской школы<small>${S.day.lessons.filter(k=>!isOpenK(k)).length} из ${S.day.lessons.length} сдано · за уроки — ⭐</small></span><b style="font-size:22px">›</b></div>`;
  });
  h+=`<div class="card" style="margin-top:14px"><div class="rule"><b>💎</b><span>Кристаллы — только за режим дня и порядок. На них — одежда, комнаты и вкусняшки для ${S.petName}.</span></div><div class="rule"><b>⭐</b><span>Звёзды — за уроки. На них — развлечения: аквапарк, кино, PlayStation.</span></div><div class="rule"><b>🌟</b><span>Весь режим дня выполнен — бонус +10 💎</span></div></div>`;
  el.innerHTML=h;
}

/* =================== СТРАНИЦА: УРОКИ =================== */
let fMode=45,fInt,stab='today',mapSubj='rus';
function renderStudy(){
  const el=$('#study');
  let h=`<div class="tabs" style="margin-top:8px"><button class="${stab==='today'?'on':''}" onclick="stab='today';renderStudy()">📌 Сегодня</button><button class="${stab==='map'?'on':''}" onclick="stab='map';renderStudy()">🗺️ Программа</button><button class="${stab==='review'?'on':''}" onclick="stab='review';renderStudy()">🧠 Повторение${needReview()?' •':''}</button><button class="${stab==='timer'?'on':''}" onclick="stab='timer';renderStudy()">⏳ Таймер</button></div>`;
  if(stab==='today')h+=studyToday();else if(stab==='map')h+=studyMap(false);else if(stab==='review')h+=studyReview();else h+=studyTimer();
  el.innerHTML=h;clearInterval(fInt);if(stab==='timer'&&S.focus&&S.focus.end>Date.now())fInt=setInterval(focusTick,1000);
}
function lessonCard(k){
  const{s,n}=LP(k),l=lget(k)||{st:'todo',step:0,photos:{}},sj=SUBJ[s];
  const tag={todo:['','Новый урок'],prog:['','В процессе'],fix:['bad','Работа над ошибками'],returned:['bad','Мама вернула'],review:['wait','На проверке у мамы'],done:['ok','Готово ✓']}[l.st];
  const debt=(S.day.carry||[]).includes(k);
  let h=`<div class="card lesson" style="border-left:6px solid ${sj.c}"><div class="head"><div><div class="muted" style="font-size:12px">${sj.e} ${sj.nm} · Урок ${n}${debt?' · <span style="color:var(--red)">долг</span>':''}</div><div class="name">${ltitle(s,n)}</div></div><span class="tag ${tag[0]}">${tag[1]}</span></div>`;
  if(l.st==='done'||l.st==='review'){h+=`<div class="muted">${l.st==='review'?'Отправлено маме. Тест: '+l.test+'%':'Урок закрыт 🎉'}</div></div>`;return h}
  h+=`<div class="steps">`;
  STEPS.forEach((st,j)=>{const done=j<l.step,cur=j===l.step,locked=j>l.step;let right='';
    if(done)right=l.photos&&l.photos[st.k]?`<img class="thumb" src="${l.photos[st.k]}">`:(st.test?`<b>${l.test}%</b>`:'✓');
    else if(cur){if(st.photo)right=`<button class="btn small" onclick="takePhoto('${k}','${st.k}',this)">📷 Фото</button>`;else if(st.test)right=`<input class="testin" type="number" min="0" max="100" placeholder="%" id="t_${s}_${n}"><button class="btn small" onclick="submitTest('${k}',this)">OK</button>`;else right=`<button class="btn small" onclick="doStep('${k}',this)">Готово</button>`}
    h+=`<div class="step ${done?'done':''} ${cur?'cur':''} ${locked?'locked':''}"><span class="ic">${st.ic}</span><span class="tx">${st.t}${st.note&&cur?`<small>${st.note}</small>`:''}${st.test&&cur&&l.st==='fix'?`<small>Разбери ошибки и пройди тест ещё раз</small>`:''}</span>${right}</div>`});
  return h+`</div></div>`;
}
function studyToday(){
  const d=S.day,we=isWeekend();let h='';
  const doneN=d.lessons.filter(k=>!isOpenK(k)).length;
  h+=`<div class="card" style="display:flex;gap:12px;align-items:center"><div style="font-size:34px">${we?'🌈':'📚'}</div><div style="flex:1"><h3 style="margin:0">${we?'Выходной':'Уроки на сегодня'}</h3><div class="muted">${we?(d.lessons.length?'Новых уроков нет — только долги за неделю':'Новых уроков нет. Отдыхай!'):`Сдано ${doneN} из ${d.lessons.length} · урок, принятый мамой, = +5 ⭐`}</div></div></div>`;
  d.lessons.forEach(k=>h+=lessonCard(k));
  const started=[];for(const s of ROT)for(const n in S.prog[s])if(OPEN.includes(S.prog[s][n].st)&&!d.lessons.includes(LK(s,n)))started.push(LK(s,n));
  if(started.length)h+=`<h2>⏸ Начатые и не законченные</h2>`+started.map(k=>{const{s,n}=LP(k);return`<div class="row"><span class="e">${SUBJ[s].e}</span><span class="tx">${ltitle(s,n)}<small>${SUBJ[s].nm} · урок ${n}</small></span><button class="btn small ghost" onclick="takeLesson('${k}')">Доделать</button></div>`}).join('');
  if(!we&&doneN===d.lessons.length&&d.lessons.length)h+=`<div class="card" style="text-align:center;background:#e9fbf4"><h3>🎉 Все уроки на сегодня сданы!</h3><button class="btn small ghost" onclick="extraLesson()">Взять ещё один урок</button></div>`;
  return h;
}
function takeLesson(k){if(!S.day.lessons.includes(k))S.day.lessons.push(k);lstart(k);save();stab='today';renderStudy();toast('📌 Урок добавлен на сегодня')}
function extraLesson(){const k=nextLesson(S.day.lessons);if(!k){toast('Все уроки I–II четверти пройдены! 🏆');return}takeLesson(k)}
function subjProgress(s){const L=SUBJ[s].L.length;let d=0,o=0;for(let n=1;n<=L;n++){const x=S.prog[s][n];if(isDoneSt(x))d++;else if(x&&OPEN.includes(x.st))o++}return{d,o,L}}
function studyMap(parent){
  let h=`<div class="card"><h3>🗺️ Программа: I–II четверть</h3><div class="muted">${parent?'Нажми на урок, чтобы отметить сделан / не сделан.':'Зелёные — сдано, фиолетовые — начато. Нажми на урок, чтобы взять его сегодня.'}</div></div>`;
  h+=`<div class="tabs">${Object.keys(SUBJ).map(s=>`<button class="${mapSubj===s?'on':''}" onclick="mapSubj='${s}';${parent?'renderParent()':'renderStudy()'}">${SUBJ[s].e} ${SUBJ[s].nm.split(' ')[0]}</button>`).join('')}</div>`;
  const s=mapSubj,sj=SUBJ[s];
  if(!sj.L.length)return h+`<div class="card" style="text-align:center"><div style="font-size:40px">🇬🇧</div><h3>Список уроков ещё не загружен</h3><div class="muted">Мама пришлёт скриншоты программы английского — и уроки появятся здесь.</div></div>`;
  const p=subjProgress(s),pct=Math.round(p.d/p.L*100);

  sj.L.forEach((t,i)=>{const n=i+1,x=S.prog[s][n],k=LK(s,n),inToday=S.day.lessons.includes(k);

    h+=`</div><div class="card"><h3>🎡 Заявки на награды</h3>`;const pr=S.pendR.map((r,k)=>({...r,k})).filter(r=>r.st==='wait');if(!pr.length)h+=`<div class="muted">Нет заявок</div>`;
    pr.forEach(r=>{const R=REWARDS.find(x=>x.id===r.id);h+=`<div class="prow"><span class="tx">${R.e} ${R.nm}<small>${r.date}</small></span><button class="btn small" onclick="okR(${r.k})">Подтвердить</button><button class="btn small ghost" onclick="noR(${r.k})">Отказать</button></div>`});
    h+=`</div><div class="card"><h3>📚 Уроки сегодня</h3>${S.day.lessons.length?S.day.lessons.map(k=>{const{s,n}=LP(k),x=lget(k);return`<div class="prow"><span class="tx">${SUBJ[s].e} ${ltitle(s,n)}<small>${SUBJ[s].nm}, урок ${n}${(S.day.carry||[]).includes(k)?' · долг':''}</small></span><span class="tag ${isDoneSt(x)?'ok':''}">${!x?'не начат':x.st==='done'?'принят':x.st==='review'?'сдан':'шаг '+((x.step||0)+1)+' из '+STEPS.length}</span></div>`}).join(''):'<div class="muted">Сегодня уроков нет</div>'}</div>`;
    h+=`<div class="card"><h3>🗒️ Что сделала и повторила</h3>${S.log.slice(-12).reverse().map(e=>{if(e.act==='review')return`<div class="prow"><span class="tx">🧠 Повторение: ${e.score}/3<small>${e.date}${e.wrong.length?' · ошибки: '+e.wrong.map(k=>{const{s,n}=LP(k);return SUBJ[s].nm.split(' ')[0]+' '+n}).join(', '):''}</small></span></div>`;const{s,n}=LP(e.k);return`<div class="prow"><span class="tx">✅ ${ltitle(s,n)}<small>${e.date} · ${SUBJ[s].nm}, урок ${n} · тест ${e.test}%</small></span></div>`}).join('')||'<div class="muted">Пока пусто</div>'}
      ${S.weak.length?`<div style="margin-top:8px"><b>Темы, где были ошибки:</b> ${S.weak.map(k=>{const{s,n}=LP(k);return SUBJ[s].e+' '+ltitle(s,n)}).join('; ')}</div>`:''}</div>`;
  }else if(ptab==='sched'){
    [['schedWD','📅 Будни'],['schedWE','🌈 Выходные']].forEach(([key,t])=>{h+=`<div class="card"><h3>${t}</h3><div class="muted" style="font-size:12px;margin-bottom:6px">Начало · успеть до · 💎</div>`;
      S[key].forEach((it,i)=>{h+=`<div class="prow"><span class="tx">${it.e} ${it.nm}</span><input type="time" value="${it.at}" onchange="S.${key}[${i}].at=this.value;save()"><input type="time" value="${it.by}" onchange="S.${key}[${i}].by=this.value;save()"><input type="number" value="${it.cr}" min="0" max="20" style="width:52px;border:2px solid var(--lav2);border-radius:10px;padding:5px;font-weight:800" onchange="S.${key}[${i}].cr=+this.value;save()"></div>`});h+=`</div>`});
    h+=`<button class="btn ghost small" onclick="S.schedWD=JSON.parse(JSON.stringify(SCHED_WD));S.schedWE=JSON.parse(JSON.stringify(SCHED_WE));save();renderParent()">Вернуть расписание по умолчанию</button>`;
  }else if(ptab==='prog'){h+=studyMap(true);
  }else if(ptab==='diary'){
    const ks=Object.keys(S.diary).sort().reverse();if(!ks.length)h+=`<div class="card muted">Записей пока нет</div>`;
    ks.forEach(k=>{h+=`<div class="card"><h3>${new Date(k+'T12:00:00').toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'long'})}</h3>${DQ.map((q,i)=>`<div class="muted" style="font-size:12px">${q}</div><div style="font-weight:700;margin-bottom:8px">${(S.diary[k][i]||'').replace(/</g,'&lt;')}</div>`).join('')}</div>`});
  }else{
    h+=`<div class="card"><h3>🧪 Проверить, как всё работает</h3><div class="chips">
      <button class="chip" onclick="S.crystals+=30;save();renderTop();toast('+30 💎')">+30 💎</button>
      <button class="chip" onclick="S.stars+=10;save();renderTop();toast('+10 ⭐')">+10 ⭐</button>
      <button class="chip" onclick="addPetXP(200);save();closeModal()">+200 опыта питомцу</button>
      <button class="chip" onclick="addMess(['sock','shirt','pants']);addMess(['toy','book','paper','crayon','peel','cup']);save();closeModal()">Беспорядок +4</button>
      <button class="chip" onclick="S.food=10;S.joy=15;save();closeModal()">Питомец голоден</button>
      <button class="chip" onclick="S.missed=2;S.sick=true;save();closeModal()">Заболел</button>
      <button class="chip" onclick="S.missed=3;S.rescue=0;save();closeModal()">Убежал в лес</button>
      <button class="chip" onclick="S.unlockedPrincess=true;save();toast('👑 Платье принцессы открыто')">Открыть платье принцессы</button>
      <button class="chip" onclick="S.girl=0;S.outfit=null;S.room='attic';save();closeModal()">Снова растрёпка на чердаке</button>
      <button class="chip" style="background:#ffe0e6" onclick="if(this.dataset.c){localStorage.removeItem(KEY);localStorage.removeItem('avgustina_world_v1');location.reload()}else{this.dataset.c=1;this.textContent='Точно? Нажми ещё раз'}">Сбросить всё</button></div></div>
      <div class="card"><h3>🔑 PIN</h3><input class="namein" style="font-size:16px" maxlength="4" inputmode="numeric" placeholder="Новый PIN из 4 цифр" onchange="if(/^\\d{4}$/.test(this.value)){S.pin=this.value;save();toast('PIN изменён')}"></div>`;
  }
  h+=`</div><button class="btn" onclick="closeModal()">Готово</button>`;$('#modal').innerHTML=h}
function approveL(k){const p=S.pendL.splice(k,1)[0];const x=lget(p.k);if(x)x.st='done';S.stars+=5+(p.test>=95?2:0);save();renderTop();chime([523,659,784,1047]);toast('⭐ +'+(5+(p.test>=95?2:0))+' звёзд');renderParent()}
function returnL(k){const p=S.pendL.splice(k,1)[0];const x=lget(p.k);if(x){x.st='returned';x.step=2;x.photos={}}if(!S.day.lessons.includes(p.k))S.day.lessons.push(p.k);save();renderTop();renderParent()}
function okR(k){S.pendR[k].st='ok';save();renderTop();renderParent()}
function noR(k){const r=S.pendR[k];r.st='no';S.stars+=REWARDS.find(x=>x.id===r.id).price;save();renderTop();renderParent()}

/* =================== МОДАЛКИ / ОНБОРДИНГ =================== */
function modal(h){$('#modal').innerHTML=h;$('#ov').classList.add('on')}
function closeModal(){$('#ov').classList.remove('on');rerender()}
let eggSel=null;
function onboarding(){modal(`<h2>Привет, Августина! 💜</h2><p class="muted">На старом чердаке нашлись три волшебных яйца. Кто-то из них станет твоим другом навсегда. Выбери одно!</p>
  <div class="eggs">${Object.entries(PET_TYPES).map(([k,v])=>`<button data-k="${k}" onclick="pickEgg('${k}',this)"><img src="${IMG(v.egg)}"><div style="font-weight:900;font-size:13px">?</div></button>`).join('')}</div>
  <button class="btn" id="hatchBtn" disabled onclick="hatch()" style="padding:14px 30px;font-size:17px">Высиживать! 🥚</button>`)}
function pickEgg(k,b){eggSel=k;document.querySelectorAll('.eggs button').forEach(x=>x.classList.toggle('sel',x===b));$('#hatchBtn').disabled=false;chime([660])}
function hatch(){const v=PET_TYPES[eggSel];modal(`<h2 id="hh">Тук-тук… кто там? 🥚</h2><div class="hatch"><img id="egg" src="${IMG(v.egg)}" class="egg-crazy" style="animation-duration:.4s"></div>`);
  const egg=$('#egg');chime([440]);setTimeout(()=>{egg.style.animationDuration='.25s';chime([520])},900);setTimeout(()=>{egg.style.animationDuration='.12s';chime([620])},1800);
  setTimeout(()=>{flash();chime([523,659,784,1047,1319]);egg.className='pop';egg.src=IMG(v.baby);const[x,y]=centerOf(egg);burst(x,y,['✨','⭐','💜','🌟'],26,200);$('#hh').textContent=`Это ${v.label.toLowerCase()}! 🎉`;
    setTimeout(()=>{$('#modal').insertAdjacentHTML('beforeend',`<p style="font-weight:800">Придумай ему имя:</p><input class="namein" id="pname" value="${eggSel==='dragon'?'Искра':eggSel==='fox'?'Рыжик':'Радуга'}" maxlength="14"><button class="btn" onclick="finishHatch()" style="padding:12px 30px">Готово 💜</button>`)},900)},2700)}
function finishHatch(){S.petName=($('#pname').value||'Искра').trim();S.petType=eggSel;S.petStage=1;S.started=true;S.lastTick=Date.now();save();closeModal();go('home');
  setTimeout(()=>{say(`Привет! Я ${S.petName}! Тут так пыльно… давай наведём порядок? 🧹`);toast('Неделя 1: приведи себя в порядок ✨')},800)}

/* =================== НАВИГАЦИЯ =================== */
let cur='home';
const PAGES={home:renderHome,day:renderDay,study:renderStudy,shop:renderShop,hobby:renderHobby,rewards:renderRewards};
function go(p){cur=p;document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id===p));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));rerender();try{history.replaceState(null,'','#'+p)}catch(e){}}
function rerender(){tick();rollDay();renderTop();PAGES[cur]();save()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.p));
$('#parentBtn').onclick=openParent;
$('#ov').onclick=e=>{if(e.target.id==='ov'&&S.started)closeModal()};
setInterval(()=>{if($('#ov').classList.contains('on'))return;tick();autoTidyPenalty();const d0=S.day.date;rollDay();save();
  if(d0!==S.day.date){rerender();return}
  if(cur==='home'){renderHomeStats()}if(cur==='day')renderDay();renderTop()},30000);
setInterval(()=>{if(cur==='home'&&!petGone()&&Math.random()<.6)sayRandom(petMood())},15000);
try{if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand()}}catch(e){}
rollDay();
const h0=(location.hash||'').slice(1);go(PAGES[h0]?h0:'home');
if(!S.started)onboarding();
</script>
</body>
</html>
