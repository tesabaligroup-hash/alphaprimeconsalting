<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Админка{% endblock %} — Alpha Prime</title>
<style>
:root{--ink:#1C1A16;--muted:#5E5849;--line:#ECE4D2;--gold:#C9A24B;--gold-ink:#7A5C17;--cream:#FBF7EC;--warn:#9A4A12;--ok:#3D6B2E}
*{box-sizing:border-box}
body{margin:0;font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:#F6F3EC;font-variant-numeric:tabular-nums}
a{color:var(--gold-ink)}
header{background:var(--ink);color:#fff;padding:12px 24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center}
header b{color:#E3C77F;letter-spacing:.2em;font-size:12px}
header nav{display:flex;flex-wrap:wrap;gap:14px;flex:1}
header nav a{color:#fff;text-decoration:none;font-size:14px;font-weight:600}
header nav a:hover{color:#E3C77F}
main{max-width:1200px;margin:0 auto;padding:24px}
h1{font-size:26px;margin:0 0 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat b{display:block;font-size:28px}
.stat span{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.table-wrap{overflow-x:auto}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=url],select,textarea{width:100%;padding:10px 12px;border:1px solid #E8DFC9;border-radius:10px;font:inherit;background:#fff}
textarea{min-height:110px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.row>*{flex:1 1 180px}
button,.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 16px;border-radius:20px;border:none;background:var(--ink);color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
.btn-gold{background:var(--gold);color:var(--ink)}
.btn-line{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.btn-danger{background:#fff;color:var(--warn);border:1px solid var(--warn)}
.pill{display:inline-block;padding:3px 10px;border-radius:10px;font-size:12px;font-weight:700;background:#FAF3E1;color:var(--gold-ink)}
.pill.ok{background:#EAF2E5;color:var(--ok)}.pill.warn{background:#FCEEE3;color:var(--warn)}.pill.muted{background:#F1ECE0;color:var(--muted)}
.muted{color:var(--muted);font-size:13px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tabs a{padding:6px 14px;border-radius:16px;border:1px solid #E8DFC9;background:#fff;text-decoration:none;color:var(--ink);font-size:13px;font-weight:600}
.tabs a.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.inline{display:inline}
img.thumb{width:120px;height:68px;object-fit:cover;border-radius:8px;background:#F3EAD3}
</style>
</head>
<body>
{% if admin %}
<header>
  <b>ALPHA PRIME</b>
  <nav aria-label="Разделы">
    <a href="/admin">Главная</a>
    <a href="/admin/news">Новости и баннеры</a>
    <a href="/admin/referrals">Рекомендации</a>
    <a href="/admin/partners">Партнёры</a>
    <a href="/admin/accruals">Начисления</a>
    <a href="/admin/users">Клиенты</a>
    <a href="/admin/stopwords">Стоп-слова</a>
  </nav>
  <form method="post" action="/admin/logout" class="inline"><button class="btn-line" style="min-height:32px">Выйти ({{ admin }})</button></form>
</header>
{% endif %}
<main>{% block content %}{% endblock %}</main>
</body>
</html>
