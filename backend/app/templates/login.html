{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:60px auto">
  <p style="letter-spacing:.2em;font-size:12px;font-weight:700;color:#7A5C17;margin:0">ALPHA PRIME</p>
  <h1>Вход в админку</h1>
  {% if error %}<p class="pill warn">{{ error }}</p>{% endif %}
  <form method="post" action="/admin/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="name">Ваше имя (для журнала действий)</label>
    <input id="name" type="text" name="name" required autocomplete="username">
    <label for="password">Пароль</label>
    <input id="password" type="password" name="password" required autocomplete="current-password">
    <p><button type="submit">Войти</button></p>
  </form>
</div>
{% endblock %}
