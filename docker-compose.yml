# Сервер: api (приложение + админка), worker (бот + синхронизация с Kommo), db (PostgreSQL), caddy (HTTPS + детское приложение kids/)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: alphaprime
      POSTGRES_USER: alphaprime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphaprime"]
      interval: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://alphaprime:${POSTGRES_PASSWORD}@db:5432/alphaprime
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://alphaprime:${POSTGRES_PASSWORD}@db:5432/alphaprime
      UPLOADS_DIR: /data/uploads
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?задайте APP_DOMAIN в .env}
      KIDS_DOMAIN: ${KIDS_DOMAIN:-kids.alpha-prime.group}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./kids:/srv/kids:ro
      - caddy_data:/data
    depends_on:
      - api

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          pg_dump -h db -U alphaprime alphaprime | gzip > /backups/db-$$(date +%F).sql.gz
          find /backups -name 'db-*.sql.gz' -mtime +30 -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  caddy_data:
